name: "Release Multiplataforma (Linux, Windows & macOS)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Instalar dependencias del sistema en Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Instalar dependencias del frontend con pnpm
        run: pnpm install

      - name: Sincronizar versión del tag (${{ github.ref_name }}) en Cargo.toml, tauri.conf.json y package.json
        if: startsWith(github.ref_name, 'v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Sincronizando versión de compilación a: $ver"
          $pkg = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content 'package.json' -Encoding UTF8
          $tconf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $tconf.version = $ver
          $tconf | ConvertTo-Json -Depth 10 | Set-Content 'src-tauri/tauri.conf.json' -Encoding UTF8
          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`"")
          Set-Content 'src-tauri/Cargo.toml' $cargo -Encoding UTF8

      - name: Generar y aplicar certificado Authenticode X.509 en Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $oid = '2.5.29.37={text}1.3.6.1.5.5.7.3.3'
          $basic = '2.5.29.19={text}'
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Karl Correa (Omnicraft Studio), O=Omnicraft Studio, C=US' -KeyUsage DigitalSignature -FriendlyName 'Omnicraft Studio Code Signing' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @($oid, $basic)
          $thumbprint = $cert.Thumbprint
          Write-Host "Certificado Authenticode generado con Thumbprint: $thumbprint"
          $confPath = 'src-tauri/tauri.conf.json'
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName 'certificateThumbprint' -NotePropertyValue $thumbprint -Force
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding UTF8

      - name: Compilar y Empaquetar con Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Omnicraft Studio ${{ github.ref_name }}'
          releaseBody: |
            ## 🎮 Omnicraft Studio ${{ github.ref_name }}
            
            ¡Nueva versión oficial multiplataforma de Omnicraft Studio!
            
            ### 📦 Paquetes Generados Automáticamente:
            - **Linux:** `.deb` (Debian/Ubuntu), `.AppImage` (Universal portátil), `.rpm` (Fedora/openSUSE)
            - **Windows:** `.msi` y asistente `.exe` (NSIS)
            - **macOS:** `.dmg` y `.app` (Universal: Intel & Apple Silicon)
            
            ### 💖 Apoyo y Donaciones:
            - [Hacer una donación vía PayPal](https://www.paypal.com/ncp/payment/KR4E3PNGJEXQY)
            - Página de donación: `donate/index.html`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publicar Release Oficial (una vez subidos todos los instaladores)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_ID=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id' | head -n 1)
          if [ -n "$REL_ID" ]; then
            gh api -X PATCH repos/${{ github.repository }}/releases/$REL_ID -F draft=false
          fi
