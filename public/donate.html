<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donar a Omnicraft Studio</title>
  <link rel="icon" type="image/png" href="../public/minecraft-icons/omnicraft_cube.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PayPal SDK con Hosted Buttons -->
  <script 
    src="https://www.paypal.com/sdk/js?client-id=BAAdhF-B5hrl8JDtqIljmDIztE8ArNKoBHAPF1IImZwcStV0XFl2LZpdXdH48HTJivqhw2lnA8DmRIfHdo&components=hosted-buttons&disable-funding=venmo&currency=USD">
  </script>
  <style>
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-black">
  <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md text-center relative overflow-hidden">
    <!-- Glow effects -->
    <div class="absolute -top-16 -left-16 w-36 h-36 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-16 -right-16 w-36 h-36 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Icon / Logo -->
    <div class="inline-flex items-center justify-center p-3 bg-slate-800/80 border border-slate-700/60 rounded-2xl shadow-inner mb-4">
      <img src="../public/minecraft-icons/crafting_table.png" alt="Omnicraft Studio" class="w-12 h-12 object-contain" />
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-indigo-400">
      Omnicraft Studio
    </h1>
    <p class="text-xs uppercase tracking-widest text-emerald-400/90 font-bold mt-1 mb-4">
      Apoyo y Donaciones al Proyecto
    </p>

    <!-- Description -->
    <p class="text-sm text-slate-400 mb-6 leading-relaxed">
      Tu donación ayuda a mantener el desarrollo activo, optimizaciones de rendimiento y soporte para nuevas versiones de Minecraft y Fabric/Forge.
    </p>

    <!-- Container del botón oficial de PayPal -->
    <div class="bg-slate-950/70 border border-slate-800/80 rounded-xl p-4 flex flex-col items-center justify-center min-h-[90px]">
      <div id="paypal-container-KR4E3PNGJEXQY" class="w-full flex justify-center"></div>
      <script>
        if (window.paypal && paypal.HostedButtons) {
          paypal.HostedButtons({
            hostedButtonId: "KR4E3PNGJEXQY",
          }).render("#paypal-container-KR4E3PNGJEXQY");
        }
      </script>
    </div>

    <!-- Links / Footer -->
    <div class="mt-6 pt-5 border-t border-slate-800/80 flex flex-col gap-2 text-xs text-slate-500">
      <div class="flex items-center justify-center gap-2">
        <span>Código abierto en</span>
        <a href="https://github.com/correakarl/omnicraft-studio" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:text-indigo-300 font-semibold hover:underline flex items-center gap-1">
          GitHub
        </a>
      </div>
      <p class="text-[11px] text-slate-600">
        Pagos seguros y cifrados procesados directamente por PayPal.
      </p>
    </div>
  </div>
</body>
</html>
