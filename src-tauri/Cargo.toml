[package]
name = "omnicraft-v2"
version = "1.1.3"
description = "Omnicraft Studio - Suite Multiplataforma Nativa para Gestión de Instancias, Mods, Skins 3D y Servidores de Minecraft"
authors = ["Karl Correa <karl.correa.88@gmail.com>"]
license = "CC-BY-NC-SA-4.0"
homepage = "https://github.com/correakarl/omnicraft-studio"
repository = "https://github.com/correakarl/omnicraft-studio"
edition = "2021"

[lib]
name = "omnicraft_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.30"
zip = "2.1"
walkdir = "2.5"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
